<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!--
    The tab icon.

    Not the launcher artwork. `assets/Luvo-icon.png` is drawn for a rounded tile
    at 48px with a lit rim and a two-colour figure inside it, and every one of
    those decisions is lost at 16px — it arrives as a dark smudge. So this is the
    one mark reduced to what survives that size: the tile's black, the artwork's
    violet-to-pink gradient, and a single stroke.

    The three colours are the measured anchors from `src/theme/tokens.ts` —
    tile #090710, violet #A98CFB, pink #FC73AC — so the tab, the header wordmark
    and the app's launcher icon are the same three values.
  -->
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A98CFB" />
      <stop offset="1" stop-color="#FC73AC" />
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#090710" />
  <path
    d="M22 17v20a10 10 0 0 0 20 0V17"
    fill="none"
    stroke="url(#brand)"
    stroke-width="7"
    stroke-linecap="round"
  />
</svg>
